name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 21 * * 1-5'
      timezone: 'Asia/Kolkata'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Markdown smoke and regression tests
        run: npm run test:ci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Email Playwright report link
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Playwright run ${{ job.status }} — ${{ github.repository }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Playwright run status: ${{ job.status }}

            Open this run to view details and download the playwright-test-results artifact:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
