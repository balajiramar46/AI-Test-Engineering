<!DOCTYPE html>
<html>

<head>
    <title>Form Context Test</title>
</head>

<body>

    <h2>Form Context Test</h2>

    <form id="loginForm">

        <input
            id="username"
            type="text"
            name="username"
        >

        <input
            type="submit"
            value="Login"
        >

    </form>


    <form id="registerForm">

        <input
            id="email"
            type="text"
            name="email"
        >

        <input
            type="submit"
            value="Login"
        >

    </form>

</body>

</html>
